# .github/workflows/update.yml
name: GlobalPulse hourly update

on:
  push:
    branches: [main]
    paths:
      - "scripts/aggregate.py"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: globalpulse-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate generator
        run: python3 -m py_compile scripts/aggregate.py

      - name: Build feeds
        run: python3 scripts/aggregate.py

      - name: Install Xray-core
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          /tmp/xray/xray version

      - name: End-to-end VLESS Reality health check
        run: |
          python3 scripts/e2e_vless_check.py \
            --xray /tmp/xray/xray \
            --input output/GlobalPulse-VLESS.txt \
            --output output/e2e-vless.json

      - name: Rebuild feeds from E2E-verified nodes
        env:
          E2E_RESULTS_FILE: output/e2e-vless.json
        run: python3 scripts/aggregate.py

      - name: Validate generated YAML
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path

          for path in [
              Path("output/GlobalPulse-Clash.yaml"),
              Path("output/GlobalPulse-Auto-Clash.yaml"),
              Path("output/GlobalPulse-Subscription.yaml"),
          ]:
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit(f"Invalid YAML root: {path}")
          proxies = yaml.safe_load(Path("output/GlobalPulse-Clash.yaml").read_text(encoding="utf-8")).get("proxies", [])
          if len(proxies) < 1:
              raise SystemExit("FAIL_CLOSED: no TCP-reachable proxies published")
          if len(proxies) > 120:
              raise SystemExit(f"FAIL_CLOSED: {len(proxies)} proxies exceeds target 120")
          import base64
          subscription = Path("output/GlobalPulse-Subscription.txt").read_text(encoding="utf-8").strip()
          try:
              decoded = base64.b64decode(subscription + "=" * (-len(subscription) % 4), validate=True).decode("utf-8")
          except Exception as exc:
              raise SystemExit(f"Invalid Base64 subscription: {exc}")
          lines = [line.strip() for line in decoded.splitlines() if line.strip()]
          if len(lines) < 1 or len(lines) > 120:
              raise SystemExit(f"FAIL_CLOSED: Base64 subscription has {len(lines)} nodes")
          if not all(line.lower().startswith("vless://") for line in lines):
              raise SystemExit("FAIL_CLOSED: Base64 subscription contains non-VLESS entries")
          stats = __import__("json").loads(Path("output/stats.json").read_text(encoding="utf-8"))
          e2e = stats.get("e2e_verified_vless", 0)
          if e2e < 1:
              raise SystemExit("FAIL_CLOSED: no end-to-end verified VLESS nodes")
          print(f"Generated YAML is valid; E2E-verified proxies: {len(proxies)}; Base64 VLESS subscription: {len(lines)}")
          PY

      - name: Commit changed feeds
        run: |
          git config user.name "GlobalPulse Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: hourly GlobalPulse update"
          git pull --rebase origin main
          git push

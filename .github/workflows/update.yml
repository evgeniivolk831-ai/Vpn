name: GlobalPulse hourly update

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: globalpulse-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggregate public feeds
        run: python3 scripts/aggregate.py

      - name: Commit changed feeds
        run: |
          git config user.name "GlobalPulse Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: hourly GlobalPulse update"
          git push

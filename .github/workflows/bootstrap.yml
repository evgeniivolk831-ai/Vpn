name: GlobalPulse initial build

on:
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build feeds
        run: python3 scripts/aggregate.py
      - name: Commit generated feeds
        run: |
          git config user.name "GlobalPulse Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: generate GlobalPulse feeds"
          git push

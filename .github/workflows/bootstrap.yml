# .github/workflows/bootstrap.yml
name: GlobalPulse initial build

on:
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: globalpulse-bootstrap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate generator
        run: python3 -m py_compile scripts/aggregate.py

      - name: Build feeds
        run: python3 scripts/aggregate.py

      - name: Commit generated feeds
        run: |
          git config user.name "GlobalPulse Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: generate GlobalPulse feeds"
          git pull --rebase origin main
          git push
